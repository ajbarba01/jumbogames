# CI: typecheck, lint, format check, and the Playwright E2E suite on every pull
# request and on pushes to main — one run per commit, since a branch push plus
# its open PR would otherwise race two suites against the one shared Supabase
# test project. E2E runs against that dedicated test project (secrets configured
# in the repo settings).
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      # Needed by the socket transport: a ticket is minted only when
      # NEXT_PUBLIC_REALTIME_WS is "1", which the whole suite now runs at.
      # Locally these come from .env.test.local, which does not exist here.
      REALTIME_TICKET_KEY: ${{ secrets.REALTIME_TICKET_KEY }}
      REALTIME_INTERNAL_SECRET: ${{ secrets.REALTIME_INTERNAL_SECRET }}
      NEXT_PUBLIC_REALTIME_URL: http://localhost:8787
      # The whole suite runs the socket transport, which is the shipping path
      # in production as of 2026-07-28. It used to run at "0" with a second,
      # flag-1 build appended for realtime.spec.ts alone, on the belief that
      # trivia.spec.ts and round-start.spec.ts could not pass against a
      # Durable Object because they POSTed the legacy force-start route. They
      # no longer do — both clear the gate through the UI via
      # readyUpThroughGate — so one build covers everything.
      NEXT_PUBLIC_REALTIME_WS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.x refuses to run on anything below 22, and the realtime
          # workspace's typecheck shells out to `wrangler types`. Local dev is
          # already on 22; CI stayed on 20 only because no pushed branch had
          # ever exercised the Worker gates before.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:realtime
      # wrangler dev reads its secrets from this gitignored file, not from the
      # job env, so it has to be materialized before Playwright boots the Worker.
      - name: Provide worker dev secrets
        run: |
          printf 'REALTIME_TICKET_KEY=%s\nREALTIME_INTERNAL_SECRET=%s\n' \
            "$REALTIME_TICKET_KEY" "$REALTIME_INTERNAL_SECRET" > apps/realtime/.dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
