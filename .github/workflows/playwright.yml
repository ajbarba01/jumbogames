# CI: typecheck, lint, format check, and the Playwright E2E suite on every pull
# request and on pushes to main — one run per commit, since a branch push plus
# its open PR would otherwise race two suites against the one shared Supabase
# test project. E2E runs against that dedicated test project (secrets configured
# in the repo settings).
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      # Needed by the socket transport. A ticket is minted only when
      # NEXT_PUBLIC_REALTIME_WS is "1", so the main suite below runs without
      # them; the flag=1 step at the end does not. Locally these come from
      # .env.test.local, which does not exist here.
      REALTIME_TICKET_KEY: ${{ secrets.REALTIME_TICKET_KEY }}
      REALTIME_INTERNAL_SECRET: ${{ secrets.REALTIME_INTERNAL_SECRET }}
      NEXT_PUBLIC_REALTIME_URL: http://localhost:8787
      # The main suite runs the Supabase path, which is still the shipping one.
      # Two specs (trivia, round-start) drive a match by POSTing the legacy
      # /slots/:ordinal/force-start route; with the socket transport on, the
      # Durable Object is authoritative and never sees that write, so those
      # specs cannot pass against it until the cutover deletes those routes and
      # rewrites them to drive through the UI. The socket path is covered by
      # test:realtime and by the dedicated step below.
      NEXT_PUBLIC_REALTIME_WS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:realtime
      # wrangler dev reads its secrets from this gitignored file, not from the
      # job env, so it has to be materialized before Playwright boots the Worker.
      - name: Provide worker dev secrets
        run: |
          printf 'REALTIME_TICKET_KEY=%s\nREALTIME_INTERNAL_SECRET=%s\n' \
            "$REALTIME_TICKET_KEY" "$REALTIME_INTERNAL_SECRET" > apps/realtime/.dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The socket path, proven end to end: one player's action reaches a
      # passive second client through the Durable Object with no refetch.
      # Rebuilds because NEXT_PUBLIC_* is inlined at build time.
      - name: E2E against the realtime worker
        run: npx playwright test e2e/realtime.spec.ts
        env:
          NEXT_PUBLIC_REALTIME_WS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
